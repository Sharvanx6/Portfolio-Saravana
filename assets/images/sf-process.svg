<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280">
  <text x="600" y="34" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">A SIX-STAGE LOOP · NOT A WATERFALL</text>

  <!-- connector line -->
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#d4d7dc" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- 6 stages -->
  <g font-family="Inter Tight, sans-serif">
    <!-- 1 -->
    <g transform="translate(80 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">01</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Flow mapping</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Lifecycle, states,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">transitions</text>
    </g>
    <!-- 2 -->
    <g transform="translate(280 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">02</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">IA structuring</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Decision trees,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">surface mapping</text>
    </g>
    <!-- 3 -->
    <g transform="translate(480 170)">
      <circle r="32" fill="#fff" stroke="#2ca01c" stroke-width="1.6"/>
      <circle r="14" fill="#2ca01c"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">03</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0c6e4f">AI-assisted exploration</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Variant copy,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">edge-case probes</text>
    </g>
    <!-- 4 -->
    <g transform="translate(680 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">04</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Pattern consolidation</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Curate, merge,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">name primitives</text>
    </g>
    <!-- 5 -->
    <g transform="translate(880 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">05</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Component standardization</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Match IDS tokens,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">a11y states</text>
    </g>
    <!-- 6 -->
    <g transform="translate(1120 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">06</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Usability refinement</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Test, iterate,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">harden the loop</text>
    </g>
  </g>
</svg>
