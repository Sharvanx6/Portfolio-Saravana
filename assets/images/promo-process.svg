<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280">
  <text x="600" y="34" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">SIX STAGES · FROM FIELD AUDIT TO ITERATION</text>

  <!-- connector line -->
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#d4d7dc" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- 6 stages -->
  <g font-family="Inter Tight, sans-serif">
    <!-- 1 -->
    <g transform="translate(80 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">01</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Field audit</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">22 fields · which ones</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">earned their place</text>
    </g>
    <!-- 2 -->
    <g transform="translate(280 170)">
      <circle r="32" fill="#fff" stroke="#0a1628" stroke-width="1.6"/>
      <circle r="14" fill="#0a1628"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">02</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">User shadowing</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">8 analysts · where</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">the form actually broke</text>
    </g>
    <!-- 3 -->
    <g transform="translate(480 170)">
      <circle r="32" fill="#fff" stroke="#6c5ce7" stroke-width="1.6"/>
      <circle r="14" fill="#6c5ce7"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">03</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#5546d6">Capability mapping</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Engine API → MCP tools</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">the agent can call</text>
    </g>
    <!-- 4 -->
    <g transform="translate(680 170)">
      <circle r="32" fill="#fff" stroke="#6c5ce7" stroke-width="1.6"/>
      <circle r="14" fill="#6c5ce7"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">04</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#5546d6">Conversation prototyping</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">Turn structure, chips,</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">disambiguation patterns</text>
    </g>
    <!-- 5 -->
    <g transform="translate(880 170)">
      <circle r="32" fill="#fff" stroke="#f0a83a" stroke-width="1.6"/>
      <circle r="14" fill="#f0a83a"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">05</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5e10">Impact-preview design</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">The friction step that</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">prevents surprise commits</text>
    </g>
    <!-- 6 -->
    <g transform="translate(1120 170)">
      <circle r="32" fill="#fff" stroke="#27a55a" stroke-width="1.6"/>
      <circle r="14" fill="#27a55a"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">06</text>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7c45">Iteration cycles</text>
      <text x="0" y="74" text-anchor="middle" font-size="11" fill="#6b6c72">v1 → v4 · each one</text>
      <text x="0" y="88" text-anchor="middle" font-size="11" fill="#6b6c72">broke something useful</text>
    </g>
  </g>
</svg>
