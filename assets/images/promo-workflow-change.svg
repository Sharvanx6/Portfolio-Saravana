<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <text x="600" y="34" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">FROM 3–7 DAYS · TO ~10 MINUTES</text>

  <!-- ===== BEFORE ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(60 70)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#c14d2e">BEFORE · 5 handoffs · 3–7 days</text>

    <!-- 5 stages strung along a line -->
    <line x1="40" y1="64" x2="1080" y2="64" stroke="#d4d7dc" stroke-width="2" stroke-dasharray="3 6"/>

    <!-- Stage 1: Analyst drafts -->
    <g transform="translate(40 64)">
      <circle r="22" fill="#fff" stroke="#c14d2e" stroke-width="1.6"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#c14d2e">1</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Analyst drafts</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Form, 22+ fields</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~45 min · errors common</text>
    </g>

    <!-- Stage 2: PM reviews -->
    <g transform="translate(300 64)">
      <circle r="22" fill="#fff" stroke="#c14d2e" stroke-width="1.6"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#c14d2e">2</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">PM reviews</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Slack screenshot</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~1 day · async loop</text>
    </g>

    <!-- Stage 3: Eng config -->
    <g transform="translate(560 64)">
      <circle r="22" fill="#fff" stroke="#c14d2e" stroke-width="1.6"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#c14d2e">3</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Eng configs</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">If custom — JIRA ticket</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">2–4 days · queue-bound</text>
    </g>

    <!-- Stage 4: Finance approves -->
    <g transform="translate(820 64)">
      <circle r="22" fill="#fff" stroke="#c14d2e" stroke-width="1.6"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#c14d2e">4</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Finance approves</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Email + PDF export</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~1 day · out of band</text>
    </g>

    <!-- Stage 5: Ship -->
    <g transform="translate(1080 64)">
      <circle r="22" fill="#fff" stroke="#c14d2e" stroke-width="1.6"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#c14d2e">5</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Ship</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Submit form</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">Pray it works</text>
    </g>

    <!-- Pain callouts below -->
    <g transform="translate(0 162)">
      <rect width="1080" height="44" rx="8" fill="#fff0eb"/>
      <text x="20" y="20" font-size="11" font-weight="600" letter-spacing=".06em" fill="#c14d2e">PAIN POINTS</text>
      <text x="20" y="36" font-size="11" fill="#0a1628">Five tools, four people, three handoffs in different timezones. No single thread of truth — Slack, Jira, email, the form, a PDF.</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="60" y1="312" x2="1140" y2="312" stroke="#d4d7dc" stroke-width="1"/>

  <!-- ===== AFTER ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(60 340)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#27a55a">AFTER · 1 surface · ~10 minutes</text>

    <line x1="40" y1="64" x2="1080" y2="64" stroke="#a294f5" stroke-width="2" stroke-dasharray="3 6"/>

    <!-- 5 stages collapsed into the agent surface -->
    <g transform="translate(40 64)">
      <circle r="22" fill="#6c5ce7"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Intent</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">User types it in plain</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">English · ~1 min</text>
    </g>

    <g transform="translate(300 64)">
      <circle r="22" fill="#6c5ce7"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Disambiguate</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Chip-based clarifying Qs</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~2 min</text>
    </g>

    <g transform="translate(560 64)">
      <circle r="22" fill="#6c5ce7"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Confirm scope</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Inline recap</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~1 min</text>
    </g>

    <g transform="translate(820 64)">
      <circle r="22" fill="#f0a83a"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Impact preview</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">Eligibility · revenue · stacks</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~2 min · approval inline</text>
    </g>

    <g transform="translate(1080 64)">
      <circle r="22" fill="#27a55a"/>
      <text y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
      <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#0a1628">Commit</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#6b6c72">One click. Done.</text>
      <text x="0" y="76" text-anchor="middle" font-size="10" fill="#6b6c72">~30 sec</text>
    </g>

    <!-- gain callouts -->
    <g transform="translate(0 162)">
      <rect width="1080" height="44" rx="8" fill="#f0faf2"/>
      <text x="20" y="20" font-size="11" font-weight="600" letter-spacing=".06em" fill="#1a7c45">WHAT WE GAINED</text>
      <text x="20" y="36" font-size="11" fill="#0a1628">All five stages on one surface. The audit trail is the chat. Custom promos no longer need engineering — the agent calls the same MCP tools.</text>
    </g>
  </g>

  <!-- ===== UNDER THE HOOD ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(60 600)">
    <text x="0" y="0" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">WHAT CHANGED UNDER THE HOOD · THE MCP LAYER</text>

    <g transform="translate(0 20)">
      <rect width="1080" height="84" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <!-- columns -->
      <g transform="translate(20 18)">
        <text font-size="10" font-weight="600" letter-spacing=".06em" fill="#5546d6">TOOLS THE AGENT CALLS</text>
        <text y="20" font-size="11" fill="#0a1628">create_promotion · estimate_impact · list_active_promos · detect_stacking_conflicts ·</text>
        <text y="36" font-size="11" fill="#0a1628">commit_to_engine · request_approval · rollback · audit_trail</text>
        <text y="56" font-size="10" fill="#6b6c72">Each is a thin wrapper over the pricing engine's existing API — no rebuild, no migration.</text>
      </g>
    </g>
  </g>
</svg>
