              <circle cx="6" cy="5" r="1.6" fill="#0c6e4f"/>
              <rect width="42" height="10" rx="1" y="14" fill="#fff" stroke="#d4d7dc"/>
              <circle cx="6" cy="19" r="1.6" fill="#0c6e4f"/>
              <rect width="42" height="10" rx="1" y="28" fill="#fff" stroke="#d4d7dc"/>
              <circle cx="6" cy="33" r="1.6" fill="#0c6e4f"/>
              <rect width="42" height="10" rx="1" y="42" fill="#fff" stroke="#d4d7dc"/>
              <circle cx="6" cy="47" r="1.6" fill="#0c6e4f"/>
