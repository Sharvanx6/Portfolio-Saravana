<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="Inter Tight, sans-serif">
  <text x="24" y="34" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">SAME BUILDER · TWO LIFECYCLE INTENTS · TWO DIFFERENT OUTPUTS</text>

