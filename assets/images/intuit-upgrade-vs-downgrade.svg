              <rect width="44" height="10" rx="1" y="28" fill="#fbd6d6"/>
              <text x="6" y="36" font-size="6" font-weight="700" fill="#b3262d">✕</text>
              <rect width="44" height="10" rx="1" y="42" fill="#fbd6d6"/>
              <text x="6" y="50" font-size="6" font-weight="700" fill="#b3262d">✕</text>
