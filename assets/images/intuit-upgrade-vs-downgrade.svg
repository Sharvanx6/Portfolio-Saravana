            <rect x="6" y="14" width="60" height="3" rx="1.5" fill="#babec5"/>
            <rect x="6" y="22" width="94" height="20" rx="3" fill="#fff" stroke="#2ca01c"/>
            <rect x="6" y="46" width="60" height="3" rx="1.5" fill="#babec5"/>
            <rect x="6" y="72" width="44" height="9" rx="2" fill="#2ca01c"/>
