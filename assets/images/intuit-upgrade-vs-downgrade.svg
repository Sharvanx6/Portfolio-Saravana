      <text x="56" y="24" font-size="11" font-weight="600" letter-spacing=".12em" fill="#0c6e4f">SCENARIO · UPGRADE · SINGLE SKU</text>
      <text x="56" y="42" font-size="13" font-weight="600" fill="#0a1628">Plus → Advanced · active customer</text>
    </g>

    <!-- builder config row -->
    <g transform="translate(0 76)">
