            <rect x="22" y="48" width="62" height="4" rx="2" fill="#393a3d"/>
            <rect x="32" y="56" width="42" height="3" rx="1.5" fill="#babec5"/>
            <rect x="34" y="70" width="38" height="9" rx="4" fill="#0a1628"/>
