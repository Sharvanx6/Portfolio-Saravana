            <rect x="6" y="14" width="40" height="3" rx="1.5" fill="#393a3d"/>
            <rect x="6" y="22" width="28" height="6" rx="2" fill="#393a3d"/>
            <line x1="6" y1="40" x2="100" y2="40" stroke="#d4d7dc" stroke-width=".6"/>
            <rect x="6" y="70" width="50" height="11" rx="2" fill="#fff" stroke="#0077c5"/>
