<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <text x="600" y="32" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">FIVE TURNS · FROM INTENT TO COMMIT</text>

  <!-- ===== 5 turn cards in row ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(60 70)">
    <!-- Turn 1: Intent -->
    <g>
      <rect width="208" height="320" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="208" height="36" rx="10" fill="#f4f3fb"/>
      <rect x="0" y="26" width="208" height="10" fill="#f4f3fb"/>
      <circle cx="20" cy="18" r="7" fill="#6c5ce7"/>
      <text x="20" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
      <text x="36" y="22" font-size="11" font-weight="600" fill="#0a1628">Intent</text>
      <!-- user msg -->
      <g transform="translate(16 56)">
        <rect width="176" height="60" rx="8" fill="#6c5ce7"/>
        <text x="12" y="20" font-size="10" font-weight="500" fill="#fff">"Run 20% off on FlowTax</text>
        <text x="12" y="34" font-size="10" font-weight="500" fill="#fff">Federal for SMB segment</text>
        <text x="12" y="48" font-size="10" font-weight="500" fill="#d5cef9">in Q3."</text>
      </g>
      <!-- behind the scenes -->
      <g transform="translate(16 134)">
        <text font-size="9" font-weight="600" letter-spacing=".08em" fill="#6b6c72">UNDER THE HOOD</text>
        <text y="18" font-size="10" fill="#0a1628">Parses intent · maps to</text>
        <text y="32" font-size="10" fill="#0a1628">promo type "discount %"</text>
        <text y="46" font-size="10" fill="#0a1628">via MCP tool registry.</text>
      </g>
      <g transform="translate(16 204)">
        <rect width="176" height="98" rx="6" fill="#f8f7fc"/>
        <text x="12" y="20" font-size="10" font-weight="600" fill="#5546d6">Identified · ambiguous</text>
        <text x="12" y="38" font-size="10" fill="#0a1628">✓ promo type</text>
        <text x="12" y="54" font-size="10" fill="#0a1628">✓ product</text>
        <text x="12" y="70" font-size="10" fill="#0a1628">✓ segment</text>
        <text x="12" y="86" font-size="10" fill="#c14d2e">! SKU variant unclear</text>
      </g>
    </g>

    <!-- arrow 1→2 -->
    <g transform="translate(216 175)" fill="#d4d7dc">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#d4d7dc" stroke-width="2"/>
      <polygon points="20,-5 28,0 20,5"/>
    </g>

    <!-- Turn 2: Disambiguate -->
    <g transform="translate(244 0)">
      <rect width="208" height="320" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="208" height="36" rx="10" fill="#f4f3fb"/>
      <rect x="0" y="26" width="208" height="10" fill="#f4f3fb"/>
      <circle cx="20" cy="18" r="7" fill="#6c5ce7"/>
      <text x="20" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
      <text x="36" y="22" font-size="11" font-weight="600" fill="#0a1628">Disambiguate</text>
      <!-- agent msg -->
      <g transform="translate(16 56)">
        <rect width="176" height="60" rx="8" fill="#f4f3fb"/>
        <text x="12" y="20" font-size="10" font-weight="500" fill="#0a1628">"Standard SKU only,</text>
        <text x="12" y="34" font-size="10" font-weight="500" fill="#0a1628">or all variants?"</text>
      </g>
      <!-- chips -->
      <g transform="translate(16 134)">
        <text font-size="9" font-weight="600" letter-spacing=".08em" fill="#6b6c72">STRUCTURED AFFORDANCES</text>
      </g>
      <g transform="translate(16 150)">
        <rect width="84" height="22" rx="11" fill="#ece9fd" stroke="#a294f5"/>
        <text x="42" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#5546d6">Standard only</text>
      </g>
      <g transform="translate(108 150)">
        <rect width="80" height="22" rx="11" fill="#fff" stroke="#d4d7dc"/>
        <text x="40" y="15" text-anchor="middle" font-size="10" font-weight="500" fill="#0a1628">All variants</text>
      </g>
      <!-- explanation -->
      <g transform="translate(16 200)">
        <rect width="176" height="102" rx="6" fill="#f8f7fc"/>
        <text x="12" y="20" font-size="10" font-weight="600" fill="#0a1628">Why chips?</text>
        <text x="12" y="38" font-size="10" fill="#6b6c72">Free-text replies broke</text>
        <text x="12" y="52" font-size="10" fill="#6b6c72">in v1 — analysts used</text>
        <text x="12" y="66" font-size="10" fill="#6b6c72">internal jargon ("std",</text>
        <text x="12" y="80" font-size="10" fill="#6b6c72">"core") the parser missed.</text>
      </g>
    </g>

    <!-- arrow 2→3 -->
    <g transform="translate(460 175)" fill="#d4d7dc">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#d4d7dc" stroke-width="2"/>
      <polygon points="20,-5 28,0 20,5"/>
    </g>

    <!-- Turn 3: Confirm scope -->
    <g transform="translate(488 0)">
      <rect width="208" height="320" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="208" height="36" rx="10" fill="#f4f3fb"/>
      <rect x="0" y="26" width="208" height="10" fill="#f4f3fb"/>
      <circle cx="20" cy="18" r="7" fill="#6c5ce7"/>
      <text x="20" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
      <text x="36" y="22" font-size="11" font-weight="600" fill="#0a1628">Confirm scope</text>
      <!-- summary -->
      <g transform="translate(16 56)">
        <rect width="176" height="160" rx="8" fill="#f4f3fb"/>
        <text x="12" y="20" font-size="10" font-weight="600" fill="#0a1628">Here's what I have:</text>
        <text x="12" y="42" font-size="10" fill="#0a1628">Promo · Discount %</text>
        <text x="12" y="58" font-size="10" fill="#0a1628">Value · 20%</text>
        <text x="12" y="74" font-size="10" fill="#0a1628">Product · FlowTax Fed</text>
        <text x="12" y="90" font-size="10" fill="#0a1628">Variant · Standard only</text>
        <text x="12" y="106" font-size="10" fill="#0a1628">Segment · SMB</text>
        <text x="12" y="122" font-size="10" fill="#0a1628">Period · Jul 1 – Sep 30</text>
        <text x="12" y="138" font-size="10" fill="#0a1628">Stacking · None</text>
        <text x="12" y="154" font-size="10" fill="#27a55a" font-weight="600">"Looks right?"</text>
      </g>
      <g transform="translate(16 234)">
        <rect width="80" height="22" rx="11" fill="#27a55a"/>
        <text x="40" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Yes, continue</text>
      </g>
      <g transform="translate(102 234)">
        <rect width="86" height="22" rx="11" fill="#fff" stroke="#d4d7dc"/>
        <text x="43" y="15" text-anchor="middle" font-size="10" font-weight="500" fill="#0a1628">Edit something</text>
      </g>
      <text x="16" y="280" font-size="9" font-weight="600" letter-spacing=".08em" fill="#6b6c72">RECAP BEFORE PREVIEW</text>
      <text x="16" y="294" font-size="10" fill="#6b6c72">No silent commits.</text>
    </g>

    <!-- arrow 3→4 -->
    <g transform="translate(704 175)" fill="#d4d7dc">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#d4d7dc" stroke-width="2"/>
      <polygon points="20,-5 28,0 20,5"/>
    </g>

    <!-- Turn 4: Impact preview -->
    <g transform="translate(732 0)">
      <rect width="208" height="320" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="208" height="36" rx="10" fill="#fff7f0"/>
      <rect x="0" y="26" width="208" height="10" fill="#fff7f0"/>
      <circle cx="20" cy="18" r="7" fill="#f0a83a"/>
      <text x="20" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
      <text x="36" y="22" font-size="11" font-weight="600" fill="#0a1628">Impact preview</text>
      <!-- metrics -->
      <g transform="translate(16 56)">
        <rect width="176" height="56" rx="6" fill="#f8f7fc"/>
        <text x="12" y="18" font-size="10" fill="#6b6c72">Eligible accounts</text>
        <text x="12" y="42" font-size="20" font-weight="700" fill="#0a1628">12,840</text>
      </g>
      <g transform="translate(16 120)">
        <rect width="176" height="56" rx="6" fill="#fff0eb"/>
        <text x="12" y="18" font-size="10" fill="#6b6c72">Est. revenue impact</text>
        <text x="12" y="42" font-size="20" font-weight="700" fill="#c14d2e">−$184k</text>
      </g>
      <g transform="translate(16 184)">
        <rect width="176" height="56" rx="6" fill="#f0faf2"/>
        <text x="12" y="18" font-size="10" fill="#6b6c72">Stacking conflicts</text>
        <text x="12" y="42" font-size="20" font-weight="700" fill="#27a55a">None</text>
      </g>
      <g transform="translate(16 252)">
        <text font-size="9" font-weight="600" letter-spacing=".08em" fill="#6b6c72">SURPRISE-FREE</text>
        <text y="16" font-size="10" fill="#0a1628">The user sees impact</text>
        <text y="30" font-size="10" fill="#0a1628">before, not after.</text>
      </g>
    </g>

    <!-- arrow 4→5 -->
    <g transform="translate(948 175)" fill="#d4d7dc">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#d4d7dc" stroke-width="2"/>
      <polygon points="20,-5 28,0 20,5"/>
    </g>

    <!-- Turn 5: Commit -->
    <g transform="translate(976 0)">
      <rect width="208" height="320" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="208" height="36" rx="10" fill="#f0faf2"/>
      <rect x="0" y="26" width="208" height="10" fill="#f0faf2"/>
      <circle cx="20" cy="18" r="7" fill="#27a55a"/>
      <text x="20" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
      <text x="36" y="22" font-size="11" font-weight="600" fill="#0a1628">Commit</text>
      <!-- approval inline -->
      <g transform="translate(16 56)">
        <rect width="176" height="80" rx="8" fill="#f8f7fc"/>
        <text x="12" y="20" font-size="10" font-weight="600" fill="#0a1628">Inline approval</text>
        <text x="12" y="38" font-size="10" fill="#6b6c72">Reviewer · k.morgan</text>
        <text x="12" y="54" font-size="10" fill="#6b6c72">Notified · in chat</text>
        <g transform="translate(12 60)">
          <rect width="64" height="14" rx="7" fill="#dcf5e2"/>
          <text x="32" y="11" text-anchor="middle" font-size="9" fill="#1a7c45" font-weight="600">APPROVED</text>
        </g>
      </g>
      <!-- commit button -->
      <g transform="translate(16 152)">
        <rect width="176" height="32" rx="6" fill="#27a55a"/>
        <text x="88" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Commit promotion ✓</text>
      </g>
      <!-- outcomes -->
      <g transform="translate(16 200)">
        <text font-size="9" font-weight="600" letter-spacing=".08em" fill="#6b6c72">EMITS</text>
        <text y="16" font-size="10" fill="#0a1628">→ pricing engine config</text>
        <text y="30" font-size="10" fill="#0a1628">→ widget card entry</text>
        <text y="44" font-size="10" fill="#0a1628">→ audit trail (full chat)</text>
        <text y="58" font-size="10" fill="#0a1628">→ rollback handle</text>
      </g>
    </g>
  </g>

  <!-- ===== 3 PRINCIPLES BELOW ===== -->
  <g transform="translate(60 450)" font-family="Inter Tight, sans-serif">
    <text font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">THREE PRINCIPLES SHAPING EVERY TURN</text>

    <!-- Principle 1 -->
    <g transform="translate(0 30)">
      <rect width="360" height="240" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="6" height="240" rx="3" fill="#6c5ce7"/>
      <text x="24" y="34" font-size="11" font-weight="600" letter-spacing=".08em" fill="#5546d6">P1 · STRUCTURED AFFORDANCES</text>
      <text x="24" y="64" font-size="14" font-weight="600" fill="#0a1628">Chips, not free-text.</text>
      <text x="24" y="96" font-size="11.5" fill="#0a1628">When the agent needs a decision, it</text>
      <text x="24" y="114" font-size="11.5" fill="#0a1628">offers tappable options first. Typing</text>
      <text x="24" y="132" font-size="11.5" fill="#0a1628">a free response is always allowed —</text>
      <text x="24" y="150" font-size="11.5" fill="#0a1628">but rarely needed.</text>
      <text x="24" y="186" font-size="11" fill="#6b6c72">Why this matters · the analysts who</text>
      <text x="24" y="202" font-size="11" fill="#6b6c72">do this work daily use shorthand. Free</text>
      <text x="24" y="218" font-size="11" fill="#6b6c72">parsing was unreliable. Chips fixed it.</text>
    </g>

    <!-- Principle 2 -->
    <g transform="translate(380 30)">
      <rect width="360" height="240" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="6" height="240" rx="3" fill="#f0a83a"/>
      <text x="24" y="34" font-size="11" font-weight="600" letter-spacing=".08em" fill="#8a5e10">P2 · IMPACT BEFORE COMMIT</text>
      <text x="24" y="64" font-size="14" font-weight="600" fill="#0a1628">Show what it does, first.</text>
      <text x="24" y="96" font-size="11.5" fill="#0a1628">Every commit step is preceded by an</text>
      <text x="24" y="114" font-size="11.5" fill="#0a1628">impact preview — eligible accounts,</text>
      <text x="24" y="132" font-size="11.5" fill="#0a1628">estimated revenue effect, conflicts</text>
      <text x="24" y="150" font-size="11.5" fill="#0a1628">with active promos.</text>
      <text x="24" y="186" font-size="11" fill="#6b6c72">Why this matters · roughly 1-in-4</text>
      <text x="24" y="202" font-size="11" fill="#6b6c72">drafts get edited or abandoned at</text>
      <text x="24" y="218" font-size="11" fill="#6b6c72">this step. Quietly, the best feature.</text>
    </g>

    <!-- Principle 3 -->
    <g transform="translate(760 30)">
      <rect width="360" height="240" rx="10" fill="#fff" stroke="#d4d7dc"/>
      <rect x="0" y="0" width="6" height="240" rx="3" fill="#27a55a"/>
      <text x="24" y="34" font-size="11" font-weight="600" letter-spacing=".08em" fill="#1a7c45">P3 · NO SILENT COMMITS</text>
      <text x="24" y="64" font-size="14" font-weight="600" fill="#0a1628">Recap, approve, commit.</text>
      <text x="24" y="96" font-size="11.5" fill="#0a1628">The agent never commits without a</text>
      <text x="24" y="114" font-size="11.5" fill="#0a1628">recap. Approvers are looped in</text>
      <text x="24" y="132" font-size="11.5" fill="#0a1628">inline — no ambush from a separate</text>
      <text x="24" y="150" font-size="11.5" fill="#0a1628">tool, no out-of-band emails.</text>
      <text x="24" y="186" font-size="11" fill="#6b6c72">Why this matters · the audit trail is</text>
      <text x="24" y="202" font-size="11" fill="#6b6c72">the chat. Finance can see exactly</text>
      <text x="24" y="218" font-size="11" fill="#6b6c72">how each promo came to exist.</text>
    </g>
  </g>
</svg>
