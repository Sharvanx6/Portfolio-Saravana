<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <text x="600" y="34" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing=".14em" fill="#6b6c72">FOUR VERSIONS · EACH BROKE SOMETHING IMPORTANT</text>

  <!-- ===== V1 ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(60 70)">
    <rect width="260" height="490" rx="10" fill="#fff" stroke="#d4d7dc"/>
    <rect x="0" y="0" width="260" height="40" rx="10" fill="#fff0eb"/>
    <rect x="0" y="30" width="260" height="10" fill="#fff0eb"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#c14d2e">v1</text>
    <text x="40" y="26" font-size="12" font-weight="600" fill="#0a1628">Free-text everywhere</text>
    <text x="240" y="26" text-anchor="end" font-size="10" fill="#6b6c72">Mar '26</text>

    <!-- mini mockup -->
    <g transform="translate(16 56)">
      <rect width="228" height="116" rx="8" fill="#f8f7fc"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#0a1628">"Tell me what you want to do."</text>
      <rect x="14" y="36" width="200" height="22" rx="4" fill="#fff" stroke="#d4d7dc"/>
      <text x="22" y="51" font-size="10" fill="#a8aab0">type your request…</text>
      <text x="14" y="80" font-size="10" fill="#6b6c72">User typed: "Drop 20 for std fed, smb,</text>
      <text x="14" y="94" font-size="10" fill="#6b6c72">q3 only, dont stack"</text>
      <g transform="translate(14 100)">
        <rect width="200" height="14" rx="3" fill="#fff0eb" stroke="#c14d2e"/>
        <text x="100" y="11" text-anchor="middle" font-size="9" font-weight="600" fill="#c14d2e">Parser failed · "drop" ≠ discount</text>
      </g>
    </g>

    <text x="16" y="200" font-size="10" font-weight="600" letter-spacing=".08em" fill="#c14d2e">WHAT BROKE</text>
    <text x="16" y="220" font-size="11" fill="#0a1628">The jargon barrier. Analysts</text>
    <text x="16" y="236" font-size="11" fill="#0a1628">used "std", "drop", "fed" —</text>
    <text x="16" y="252" font-size="11" fill="#0a1628">internal slang the parser had</text>
    <text x="16" y="268" font-size="11" fill="#0a1628">never seen.</text>

    <text x="16" y="312" font-size="10" font-weight="600" letter-spacing=".08em" fill="#5546d6">WHAT WE LEARNED</text>
    <text x="16" y="332" font-size="11" fill="#0a1628">Conversation alone isn't a UI.</text>
    <text x="16" y="348" font-size="11" fill="#0a1628">It needs scaffolding — the</text>
    <text x="16" y="364" font-size="11" fill="#0a1628">moves the user can actually</text>
    <text x="16" y="380" font-size="11" fill="#0a1628">make have to be visible.</text>

    <g transform="translate(16 412)">
      <rect width="228" height="60" rx="8" fill="#fff7f0" stroke="#f0a83a"/>
      <text x="14" y="22" font-size="10" font-weight="600" letter-spacing=".06em" fill="#8a5e10">DECISION</text>
      <text x="14" y="40" font-size="11" fill="#0a1628">Introduce chips for every</text>
      <text x="14" y="54" font-size="11" fill="#0a1628">decision the agent asks for.</text>
    </g>
  </g>

  <!-- arrow v1→v2 -->
  <g transform="translate(326 314)" fill="#d4d7dc">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#d4d7dc" stroke-width="2"/>
    <polygon points="22,-5 30,0 22,5"/>
  </g>

  <!-- ===== V2 ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(360 70)">
    <rect width="260" height="490" rx="10" fill="#fff" stroke="#d4d7dc"/>
    <rect x="0" y="0" width="260" height="40" rx="10" fill="#fff7f0"/>
    <rect x="0" y="30" width="260" height="10" fill="#fff7f0"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#8a5e10">v2</text>
    <text x="40" y="26" font-size="12" font-weight="600" fill="#0a1628">Chips · no impact view</text>
    <text x="240" y="26" text-anchor="end" font-size="10" fill="#6b6c72">Apr '26</text>

    <g transform="translate(16 56)">
      <rect width="228" height="116" rx="8" fill="#f8f7fc"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#0a1628">"Standard SKU only?"</text>
      <g transform="translate(14 32)">
        <rect width="80" height="20" rx="10" fill="#ece9fd" stroke="#a294f5"/>
        <text x="40" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#5546d6">Standard</text>
        <g transform="translate(88 0)">
          <rect width="84" height="20" rx="10" fill="#fff" stroke="#d4d7dc"/>
          <text x="42" y="14" text-anchor="middle" font-size="10" fill="#0a1628">All variants</text>
        </g>
      </g>
      <text x="14" y="80" font-size="10" fill="#6b6c72">Then: agent commits silently.</text>
      <g transform="translate(14 88)">
        <rect width="200" height="22" rx="4" fill="#27a55a"/>
        <text x="100" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Commit promotion ✓</text>
      </g>
    </g>

    <text x="16" y="200" font-size="10" font-weight="600" letter-spacing=".08em" fill="#c14d2e">WHAT BROKE</text>
    <text x="16" y="220" font-size="11" fill="#0a1628">User testing: 3 of 8 analysts</text>
    <text x="16" y="236" font-size="11" fill="#0a1628">accidentally committed promos</text>
    <text x="16" y="252" font-size="11" fill="#0a1628">they hadn't fully thought through.</text>
    <text x="16" y="268" font-size="11" fill="#0a1628">No "are you sure?" moment.</text>

    <text x="16" y="312" font-size="10" font-weight="600" letter-spacing=".08em" fill="#5546d6">WHAT WE LEARNED</text>
    <text x="16" y="332" font-size="11" fill="#0a1628">Conversational UX feels fast.</text>
    <text x="16" y="348" font-size="11" fill="#0a1628">Sometimes too fast — there's</text>
    <text x="16" y="364" font-size="11" fill="#0a1628">no friction reminding the user</text>
    <text x="16" y="380" font-size="11" fill="#0a1628">money is on the line.</text>

    <g transform="translate(16 412)">
      <rect width="228" height="60" rx="8" fill="#fff7f0" stroke="#f0a83a"/>
      <text x="14" y="22" font-size="10" font-weight="600" letter-spacing=".06em" fill="#8a5e10">DECISION</text>
      <text x="14" y="40" font-size="11" fill="#0a1628">Add an impact preview step</text>
      <text x="14" y="54" font-size="11" fill="#0a1628">before commit. Always.</text>
    </g>
  </g>

  <!-- arrow v2→v3 -->
  <g transform="translate(626 314)" fill="#d4d7dc">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#d4d7dc" stroke-width="2"/>
    <polygon points="22,-5 30,0 22,5"/>
  </g>

  <!-- ===== V3 ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(660 70)">
    <rect width="260" height="490" rx="10" fill="#fff" stroke="#d4d7dc"/>
    <rect x="0" y="0" width="260" height="40" rx="10" fill="#f8f7fc"/>
    <rect x="0" y="30" width="260" height="10" fill="#f8f7fc"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#5546d6">v3</text>
    <text x="40" y="26" font-size="12" font-weight="600" fill="#0a1628">Impact preview · edit broken</text>
    <text x="240" y="26" text-anchor="end" font-size="10" fill="#6b6c72">May '26</text>

    <g transform="translate(16 56)">
      <rect width="228" height="116" rx="8" fill="#f8f7fc"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#0a1628">Impact preview</text>
      <g transform="translate(14 32)">
        <rect width="64" height="36" rx="6" fill="#fff"/>
        <text x="32" y="14" text-anchor="middle" font-size="8" fill="#6b6c72">Eligible</text>
        <text x="32" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#0a1628">12.8k</text>
        <g transform="translate(70 0)">
          <rect width="64" height="36" rx="6" fill="#fff"/>
          <text x="32" y="14" text-anchor="middle" font-size="8" fill="#6b6c72">Revenue</text>
          <text x="32" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#c14d2e">−$184k</text>
        </g>
        <g transform="translate(140 0)">
          <rect width="60" height="36" rx="6" fill="#fff"/>
          <text x="30" y="14" text-anchor="middle" font-size="8" fill="#6b6c72">Stacks</text>
          <text x="30" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#27a55a">0</text>
        </g>
      </g>
      <text x="14" y="92" font-size="10" fill="#6b6c72">User taps "Edit" → context lost,</text>
      <text x="14" y="106" font-size="10" fill="#6b6c72">starts over from intent again.</text>
    </g>

    <text x="16" y="200" font-size="10" font-weight="600" letter-spacing=".08em" fill="#c14d2e">WHAT BROKE</text>
    <text x="16" y="220" font-size="11" fill="#0a1628">The Edit button discarded the</text>
    <text x="16" y="236" font-size="11" fill="#0a1628">whole conversation. Users had</text>
    <text x="16" y="252" font-size="11" fill="#0a1628">to re-state intent, re-disambig,</text>
    <text x="16" y="268" font-size="11" fill="#0a1628">re-everything.</text>

    <text x="16" y="312" font-size="10" font-weight="600" letter-spacing=".08em" fill="#5546d6">WHAT WE LEARNED</text>
    <text x="16" y="332" font-size="11" fill="#0a1628">Edit must be surgical, not</text>
    <text x="16" y="348" font-size="11" fill="#0a1628">destructive. The agent should</text>
    <text x="16" y="364" font-size="11" fill="#0a1628">offer to edit one field while</text>
    <text x="16" y="380" font-size="11" fill="#0a1628">remembering the rest.</text>

    <g transform="translate(16 412)">
      <rect width="228" height="60" rx="8" fill="#fff7f0" stroke="#f0a83a"/>
      <text x="14" y="22" font-size="10" font-weight="600" letter-spacing=".06em" fill="#8a5e10">DECISION</text>
      <text x="14" y="40" font-size="11" fill="#0a1628">Pre-load all gathered state.</text>
      <text x="14" y="54" font-size="11" fill="#0a1628">Edits target single fields.</text>
    </g>
  </g>

  <!-- arrow v3→v4 -->
  <g transform="translate(926 314)" fill="#d4d7dc">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#d4d7dc" stroke-width="2"/>
    <polygon points="22,-5 30,0 22,5"/>
  </g>

  <!-- ===== V4 ===== -->
  <g font-family="Inter Tight, sans-serif" transform="translate(960 70)">
    <rect width="180" height="490" rx="10" fill="#fff" stroke="#27a55a" stroke-width="1.6"/>
    <rect x="0" y="0" width="180" height="40" rx="10" fill="#f0faf2"/>
    <rect x="0" y="30" width="180" height="10" fill="#f0faf2"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#1a7c45">v4</text>
    <text x="40" y="26" font-size="12" font-weight="600" fill="#0a1628">Approval inline</text>
    <text x="160" y="26" text-anchor="end" font-size="10" fill="#6b6c72">Jun '26</text>

    <g transform="translate(16 56)">
      <rect width="148" height="116" rx="8" fill="#f8f7fc"/>
      <text x="12" y="22" font-size="10" font-weight="600" fill="#0a1628">Approver in chat</text>
      <g transform="translate(12 32)">
        <rect width="124" height="20" rx="10" fill="#fff" stroke="#d4d7dc"/>
        <circle cx="12" cy="10" r="5" fill="#a294f5"/>
        <text x="22" y="14" font-size="10" fill="#0a1628">@k.morgan</text>
      </g>
      <text x="12" y="76" font-size="10" fill="#6b6c72">Approval logged</text>
      <text x="12" y="90" font-size="10" fill="#6b6c72">directly in thread.</text>
      <g transform="translate(12 96)">
        <rect width="124" height="14" rx="7" fill="#dcf5e2"/>
        <text x="62" y="11" text-anchor="middle" font-size="9" fill="#1a7c45" font-weight="600">APPROVED ✓</text>
      </g>
    </g>

    <text x="16" y="200" font-size="10" font-weight="600" letter-spacing=".08em" fill="#27a55a">SHIPPED</text>
    <text x="16" y="220" font-size="11" fill="#0a1628">Custom promo time:</text>
    <text x="16" y="236" font-size="11" fill="#0a1628">3–7 days → ~10 min.</text>

    <text x="16" y="268" font-size="11" fill="#0a1628">Eng tickets for promo</text>
    <text x="16" y="284" font-size="11" fill="#0a1628">config: eliminated.</text>

    <text x="16" y="316" font-size="11" fill="#0a1628">60% of standard promos</text>
    <text x="16" y="332" font-size="11" fill="#0a1628">authored via agent.</text>

    <text x="16" y="364" font-size="11" fill="#0a1628">1-in-4 drafts caught</text>
    <text x="16" y="380" font-size="11" fill="#0a1628">at impact preview.</text>

    <g transform="translate(16 412)">
      <rect width="148" height="60" rx="8" fill="#f0faf2" stroke="#27a55a"/>
      <text x="12" y="22" font-size="10" font-weight="600" letter-spacing=".06em" fill="#1a7c45">RESULT</text>
      <text x="12" y="40" font-size="11" fill="#0a1628">One surface. One</text>
      <text x="12" y="54" font-size="11" fill="#0a1628">audit trail. Real time.</text>
    </g>
  </g>
</svg>
