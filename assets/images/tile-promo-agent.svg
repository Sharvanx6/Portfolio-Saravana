<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset=".55" stop-color="#332871"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".40"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- ambient particles -->
  <g opacity=".22" fill="#fff">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="700" cy="60" r="1.6"/>
    <circle cx="660" cy="430" r="2.4"/>
    <circle cx="180" cy="420" r="1.4"/>
    <circle cx="60" cy="250" r="1.8"/>
    <circle cx="740" cy="280" r="1.2"/>
  </g>

  <!-- MCP pill top-right -->
  <g transform="translate(540 60)" opacity=".92">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.38)" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#a294f5"/>
    <text x="32" y="22" fill="#fff" font-family="Inter Tight, sans-serif" font-size="13" font-weight="500">mcp · pricing engine</text>
  </g>

  <!-- conversation surface (centered card) -->
  <g transform="translate(180 130)" filter="url(#card-shadow)">
    <!-- back card -->
    <g transform="translate(28 22) rotate(-3 220 130)" opacity=".5">
      <rect width="440" height="240" rx="14" fill="#1d1645"/>
      <rect x="0" y="0" width="440" height="8" rx="4" fill="#a294f5"/>
    </g>
    <!-- mid card -->
    <g transform="translate(14 11) rotate(-1.5 220 130)" opacity=".75">
      <rect width="440" height="250" rx="14" fill="#251c52"/>
      <rect x="0" y="0" width="440" height="8" rx="4" fill="#8c7ced"/>
    </g>
    <!-- front card -->
    <g>
      <rect width="440" height="260" rx="14" fill="#ffffff"/>
      <rect x="0" y="0" width="440" height="8" rx="4" fill="#6c5ce7"/>

      <!-- header -->
      <text x="20" y="40" fill="#0a1628" font-family="Inter Tight, sans-serif" font-size="13" font-weight="600">Promotions · Conversational Agent</text>
      <g transform="translate(20 50)">
        <rect width="80" height="18" rx="9" fill="#ece9fd"/>
        <text x="40" y="13" text-anchor="middle" fill="#5546d6" font-family="Inter Tight, sans-serif" font-size="9" font-weight="600" letter-spacing=".06em">DRAFTING</text>
      </g>

      <!-- user bubble -->
      <g transform="translate(160 84)">
        <rect width="260" height="40" rx="10" fill="#6c5ce7"/>
        <text x="16" y="18" fill="#fff" font-family="Inter Tight, sans-serif" font-size="11" font-weight="500">Run 20% off on FlowTax Federal</text>
        <text x="16" y="32" fill="#d5cef9" font-family="Inter Tight, sans-serif" font-size="11">for SMB segment, Q3.</text>
      </g>

      <!-- agent bubble -->
      <g transform="translate(20 138)">
        <rect width="280" height="56" rx="10" fill="#f4f3fb"/>
        <text x="14" y="18" fill="#0a1628" font-family="Inter Tight, sans-serif" font-size="11" font-weight="500">A 20% off discount on FlowTax Fed</text>
        <text x="14" y="32" fill="#0a1628" font-family="Inter Tight, sans-serif" font-size="11">to SMB cohort, Jul 1 – Sep 30.</text>
        <text x="14" y="48" fill="#5546d6" font-family="Inter Tight, sans-serif" font-size="10" font-weight="600">Show impact preview →</text>
      </g>

      <!-- chips row -->
      <g transform="translate(20 206)">
        <rect width="78" height="22" rx="11" fill="#fff" stroke="#d4d7dc" stroke-width="1"/>
        <text x="39" y="15" text-anchor="middle" fill="#0a1628" font-family="Inter Tight, sans-serif" font-size="10" font-weight="500">Price Lock</text>
        <g transform="translate(86 0)">
          <rect width="64" height="22" rx="11" fill="#fff" stroke="#d4d7dc" stroke-width="1"/>
          <text x="32" y="15" text-anchor="middle" fill="#0a1628" font-family="Inter Tight, sans-serif" font-size="10" font-weight="500">BXGY</text>
        </g>
        <g transform="translate(158 0)">
          <rect width="60" height="22" rx="11" fill="#fff" stroke="#d4d7dc" stroke-width="1"/>
          <text x="30" y="15" text-anchor="middle" fill="#0a1628" font-family="Inter Tight, sans-serif" font-size="10" font-weight="500">Cap</text>
        </g>
        <g transform="translate(226 0)">
          <rect width="92" height="22" rx="11" fill="#ece9fd" stroke="#a294f5" stroke-width="1"/>
          <text x="46" y="15" text-anchor="middle" fill="#5546d6" font-family="Inter Tight, sans-serif" font-size="10" font-weight="600">Custom · 14d</text>
        </g>
      </g>
    </g>
  </g>

  <!-- impact preview pill -->
  <g transform="translate(490 380)">
    <rect width="240" height="32" rx="16" fill="#ffffff" opacity=".95"/>
    <text x="16" y="20" fill="#5546d6" font-family="Inter Tight, sans-serif" font-size="12" font-weight="600">Impact preview</text>
    <text x="125" y="20" fill="#6b6c72" font-family="Inter Tight, sans-serif" font-size="11">· before commit</text>
  </g>
</svg>
