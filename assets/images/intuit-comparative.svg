      <rect x="78" y="100" width="60" height="46" rx="3" fill="#0a1628"/>
      <rect x="142" y="100" width="60" height="46" rx="3" fill="#0a1628"/>
      <rect x="206" y="100" width="60" height="46" rx="3" fill="#0a1628"/>
      <text x="14" y="160" font-family="Inter Tight, sans-serif" font-size="9" fill="#6b6c72">Next charge: Aug 12, $15.49</text>
