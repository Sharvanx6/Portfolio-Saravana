        <circle cx="12" cy="89" r="3" fill="#0c6e4f"/>
        <rect x="22" y="86" width="84" height="6" rx="2" fill="#393a3d"/>
        <rect x="158" y="78" width="146" height="22" rx="3" fill="#fbd6d6"/>
