<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="op-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a20"/>
      <stop offset=".55" stop-color="#0c2a33"/>
      <stop offset="1" stop-color="#14616a"/>
    </linearGradient>
    <radialGradient id="op-glow" cx=".78" cy=".2" r=".6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="op-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#op-bg)"/>
  <rect width="800" height="500" fill="url(#op-glow)"/>

  <!-- ambient dots -->
  <g opacity=".25" fill="#5eead4">
    <circle cx="96" cy="72" r="2"/><circle cx="716" cy="66" r="1.6"/>
    <circle cx="680" cy="440" r="2.2"/><circle cx="150" cy="430" r="1.4"/>
    <circle cx="58" cy="260" r="1.8"/><circle cx="752" cy="300" r="1.2"/>
  </g>

  <!-- journey rail: signed -> details -> order -> live -->
  <g transform="translate(120 58)" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" letter-spacing=".08em">
    <line x1="0" y1="10" x2="560" y2="10" stroke="#5eead4" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="0" y1="10" x2="373" y2="10" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="0" cy="10" r="7" fill="#14b8a6"/>
    <circle cx="187" cy="10" r="7" fill="#14b8a6"/>
    <circle cx="373" cy="10" r="9" fill="#0c2a33" stroke="#5eead4" stroke-width="3"/>
    <circle cx="560" cy="10" r="7" fill="#0c2a33" stroke="#5eead4" stroke-opacity=".6" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" fill="#a5d9de">SIGNED</text>
    <text x="187" y="38" text-anchor="middle" fill="#a5d9de">SET UP</text>
    <text x="373" y="38" text-anchor="middle" fill="#ffffff">ORDER REVIEW</text>
    <text x="560" y="38" text-anchor="middle" fill="#a5d9de" fill-opacity=".7">LIVE</text>
  </g>

  <!-- back card: needs fixes -->
  <g transform="translate(470 150) rotate(4 140 110)" filter="url(#op-shadow)" font-family="Inter Tight, sans-serif">
    <rect width="250" height="200" rx="14" fill="#ffffff" opacity=".96"/>
    <text x="20" y="36" fill="#21262a" font-size="14" font-weight="600">Needs fixes (12)</text>
    <g transform="translate(20 54)">
      <rect width="210" height="56" rx="10" fill="#fbf1f3" stroke="#e2b8be"/>
      <text x="14" y="24" fill="#21262a" font-size="12" font-weight="600">Payment</text>
      <text x="14" y="42" fill="#6b6c72" font-size="10.5">10 entities · grouped</text>
      <text x="168" y="34" fill="#0077c5" font-size="11.5" font-weight="600">Resolve ›</text>
    </g>
    <g transform="translate(20 122)">
      <rect width="210" height="56" rx="10" fill="#fef3d8" stroke="#ecd49a"/>
      <text x="14" y="24" fill="#21262a" font-size="12" font-weight="600">Address</text>
      <text x="14" y="42" fill="#6b6c72" font-size="10.5">2 entities · grouped</text>
      <text x="168" y="34" fill="#0077c5" font-size="11.5" font-weight="600">Resolve ›</text>
    </g>
  </g>

  <!-- front card: order review -->
  <g transform="translate(90 140)" filter="url(#op-shadow)" font-family="Inter Tight, sans-serif">
    <rect width="420" height="270" rx="16" fill="#ffffff"/>
    <rect width="420" height="6" rx="3" fill="#14b8a6"/>
    <text x="24" y="44" fill="#21262a" font-size="16" font-weight="600">Order review</text>
    <g transform="translate(300 28)">
      <rect width="96" height="22" rx="11" fill="#e6f4ec"/>
      <text x="48" y="15" text-anchor="middle" fill="#0f7d4d" font-size="10" font-weight="700" letter-spacing=".06em">SCHEDULED</text>
    </g>
    <line x1="24" y1="64" x2="396" y2="64" stroke="#eceef1"/>
    <text x="24" y="92" fill="#6b6c72" font-size="12">You will be charged on</text>
    <text x="24" y="118" fill="#21262a" font-size="19" font-weight="600">Sunday, February 1, 2026</text>
    <text x="250" y="92" fill="#6b6c72" font-size="12">First billed amount</text>
    <text x="250" y="118" fill="#21262a" font-size="19" font-weight="600">$2,400.00<tspan fill="#6b6c72" font-size="12" font-weight="500"> /mo</tspan></text>
    <g transform="translate(24 140)">
      <rect width="104" height="38" rx="8" fill="#0077c5"/>
      <text x="52" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Pay now</text>
      <text x="124" y="24" fill="#0077c5" font-size="12.5" font-weight="600">Select another date</text>
    </g>
    <line x1="24" y1="198" x2="396" y2="198" stroke="#eceef1"/>
    <g transform="translate(24 214)">
      <rect width="132" height="30" rx="15" fill="#f7f9fc" stroke="#d4d7dc"/>
      <text x="16" y="19" fill="#0365ac" font-size="11" font-weight="600">Contract · CTR-9358 ↓</text>
      <text x="250" y="19" fill="#6b6c72" font-size="11">Payment split up ·</text>
      <text x="345" y="19" fill="#0365ac" font-size="11" font-weight="600">View</text>
    </g>
  </g>
</svg>
